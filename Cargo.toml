[package]
name = "suwayomi-tray"
version = "0.1.0"
description = "Suwayomi 桌面壳：无头 server + 系统托盘 + WebUI 窗口（Tauri 2）"
edition = "2021"

# 产物名：suwayomi.exe（桌面壳；无头服务器为 suwayomi-server.exe）
[[bin]]
name = "suwayomi"
path = "src/main.rs"

# 独立于根 workspace（tauri 依赖树庞大，避免拖慢主项目构建/CI）
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 仅构建期用：在 build.rs 解码托盘图标，运行时不再依赖 png（见 02 文档 §H）
png = "0.17"

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "tray-icon", "common-controls-v6", "dynamic-acl", "x11", "dbus"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
sysinfo = "0.33"

[profile.release]
strip = true
