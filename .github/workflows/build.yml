name: Build

# 可复用构建工作流（workflow_call）：桌面 target 的编译与打包都在这里完成。
# 调用方 release.yml 负责算版本号、挑 target、把结果发布成 Release —— 与主仓
# Suwayomi-next 同款拆法（那边也是 build.yml + release.yml 两个文件）。
#
# 资产名固定 suwayomi-tray-<V>-<target>[.exe]，**不带通道段**：主仓的
# Suwayomi-{VER}{通道段}-{TGT} 要带是因为 beta 与 release 共用 3.y.z 版本名，
# 而桌面壳一个 release 里只有一套资产，通道靠 tag 区分就够了。
# 主页 scripts/resolve-tray.sh 按这个形状正则解析，改资产名会连带失效。

on:
  workflow_call:
    inputs:
      version_name:
        description: 版本名（三段 semver，如 1.0.23；注入 tauri.conf.json，Windows 上还进 PE 版本资源）
        required: true
        type: string
      version_code:
        description: 版本代号（本仓库提交数 + 1000），仅进日志
        required: true
        type: string
      channel:
        description: alpha / beta / release（仅用于日志）
        required: true
        type: string
      targets:
        description: 桌面构建矩阵 include 数组（JSON 字符串，元素含 target/os/rust_target）
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: 构建 ${{ matrix.target }}
    # targets 可以是空数组 —— 矩阵为空会让 Actions 直接报错，所以显式跳过。
    if: inputs.targets != '[]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.targets) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: 安装 llvm-mingw（gnullvm 目标）
        # gnullvm 的默认 linker 就是 llvm-mingw 的 <triple>-clang（rustc 的 target spec 里写死的），
        # PE 版本资源那步也要它提供的 windres —— rustup 给该 target 的 lib/self-contained/ 只有
        # crt2.o / dllcrt2.o，缺 libmingw32 / libmingwex。runner 上的 MSVC 工具链在这个 target 下
        # 用不上。与主仓 Suwayomi-next 的这一步同款，改一处要改两处。
        if: contains(matrix.rust_target, 'gnullvm')
        shell: bash
        run: |
          V="20260922"
          DIR="llvm-mingw-${V}-ucrt-x86_64"
          # 版本写死：该工具链只提供 linker 与 mingw 库，不参与 rust target 的选择，
          # 浮动起来只会让产物不可复现。
          curl -fsSL --retry 3 -o llvm-mingw.zip \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${V}/${DIR}.zip"
          # Windows runner 的 Git for Windows 没有 unzip，走 python3 zipfile。
          python3 -c "import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall('.')" llvm-mingw.zip
          rm -f llvm-mingw.zip
          test -x "$DIR/bin/x86_64-w64-mingw32-clang.exe" || { echo "::error::llvm-mingw 解压异常（缺 $DIR/bin）"; exit 1; }
          # 交给后续步骤（cargo / cc / windres）找。路径给 Windows 形式：GITHUB_PATH 的条目
          # 会进原生进程的 PATH，`/d/...` 那种 POSIX 形式对它们无意义。
          echo "$(pwd -W)/$DIR/bin" >> "$GITHUB_PATH"
      - name: 安装系统依赖（Linux）
        # webkit2gtk 是 WebView 窗口的后端，appindicator 是托盘图标的后端；
        # ubuntu-24.04-arm 的 arm64 源里有同名包，两个架构共用同一条命令。
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev
      - name: 构建
        shell: bash
        env:
          SUWAYOMI_TRAY_VERSION: ${{ inputs.version_name }}
          # 托盘与主仓一样按 target 编（宿主 == target 时也是显式给，产物路径因此唯一）。
          SUWAYOMI_TRAY_TARGET: ${{ matrix.rust_target }}
        run: bash build-tray.sh
      - name: 重命名资产
        id: name
        shell: bash
        run: |
          VER="${{ inputs.version_name }}"
          TGT="${{ matrix.target }}"
          RT="${{ matrix.rust_target }}"
          OUTDIR="target/${RT}/release"
          # 资产名里的 target 段就是 matrix.target —— 它已带工具链段（gnullvm 那份是
          # windows-x64-gnullvm），主仓按同一规则取自己那份对应的桌面壳。
          OUT="suwayomi-tray-${VER}-${TGT}"
          # 判平台一律用 runner.os，不要拿 matrix.os 的 runner 标签比字面量 ——
          # Windows 的 runner 标签不止 windows-latest 一个（还有 windows-11-arm）。
          [ "${{ runner.os }}" = "Windows" ] && OUT="${OUT}.exe"
          mv "${OUTDIR}/suwayomi$( [ "${{ runner.os }}" = "Windows" ] && echo .exe )" "$OUT"
          ASSETS="$OUT"
          # gnullvm 的 exe 动态链 WebView2Loader.dll（WebView2 SDK 那份，cargo 会把它复制到
          # 产物目录），两者必须一起发 —— 主仓按 <exe 同名>.dll 取，缺它托盘起不来。
          case "$RT" in
            *gnullvm)
              SRC="${OUTDIR}/WebView2Loader.dll"
              [ -f "$SRC" ] || { echo "::error::gnullvm 产物里没有 WebView2Loader.dll（$SRC）"; exit 1; }
              DLL="suwayomi-tray-${VER}-${TGT}.dll"
              cp "$SRC" "$DLL"
              ASSETS="$ASSETS"$'\n'"$DLL"
              ;;
          esac
          {
            echo "asset=$OUT"
            echo "assets<<ASSETS_EOF"
            printf '%s\n' "$ASSETS"
            echo "ASSETS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "资产: $(printf '%s' "$ASSETS" | tr '\n' ' ')"
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: suwayomi-tray-${{ inputs.version_name }}-${{ matrix.target }}
          path: ${{ steps.name.outputs.assets }}
