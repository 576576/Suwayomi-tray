name: Release

# 桌面壳（Tauri 托盘）的独立发布流水线。产出六个桌面 target 的裸可执行文件，
# 由 Suwayomi-next 的打包流程按 <base>/suwayomi-tray-<V>-<target>[.exe] 下载并
# 放进发布包根目录（与 bin/suwayomi-server 同级）。
#
# 触发：
#   push tag v*          —— 版本号取 tag（v1.4.0 → 1.4.0）
#   workflow_dispatch    —— 手动指定版本号，tag 由本工作流创建
#
# 版本号必须是三段 semver：tauri-build 只认 x.y.z（Windows 上它进 PE 版本资源），
# 写成 1.4 会在注入版本那一步才炸，所以在 prep 里先拦掉。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: 版本号（三段 semver，如 1.4.0）
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prep:
    name: 解析版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.out.outputs.version }}
      tag: ${{ steps.out.outputs.tag }}
    steps:
      - name: 版本号与 tag
        id: out
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version_name }}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号必须是三段 semver（如 1.4.0），收到 '$VER'"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "桌面壳 $VER -> tag v$VER"

  build:
    name: 构建 ${{ matrix.target }}
    needs: prep
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # runner 与 rust target 与 Suwayomi-next 的桌面矩阵一致（原生同架构编译）。
        include:
          - { target: windows-x64,   os: windows-latest,   rust_target: x86_64-pc-windows-msvc }
          - { target: windows-arm64, os: windows-11-arm,   rust_target: aarch64-pc-windows-msvc }
          - { target: linux-x64,     os: ubuntu-latest,    rust_target: x86_64-unknown-linux-gnu }
          - { target: linux-arm64,   os: ubuntu-24.04-arm, rust_target: aarch64-unknown-linux-gnu }
          - { target: macos-x64,     os: macos-15-intel,   rust_target: x86_64-apple-darwin }
          - { target: macos-arm64,   os: macos-15,         rust_target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: 安装系统依赖（Linux）
        # webkit2gtk 是 WebView 窗口的后端，appindicator 是托盘图标的后端；
        # ubuntu-24.04-arm 的 arm64 源里有同名包，两个架构共用同一条命令。
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev
      - name: 构建
        shell: bash
        env:
          SUWAYOMI_TRAY_VERSION: ${{ needs.prep.outputs.version }}
        run: bash build-tray.sh
      - name: 重命名资产
        id: name
        shell: bash
        run: |
          VER="${{ needs.prep.outputs.version }}"
          TGT="${{ matrix.target }}"
          OUT="suwayomi-tray-${VER}-${TGT}"
          # 判平台一律用 runner.os，不要拿 matrix.os 的 runner 标签比字面量 ——
          # Windows 的 runner 标签不止 windows-latest 一个（还有 windows-11-arm）。
          [ "${{ runner.os }}" = "Windows" ] && OUT="${OUT}.exe"
          mv "target/release/suwayomi$( [ "${{ runner.os }}" = "Windows" ] && echo .exe )" "$OUT"
          echo "asset=$OUT" >> "$GITHUB_OUTPUT"
          echo "资产: $OUT"
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: suwayomi-tray-${{ needs.prep.outputs.version }}-${{ matrix.target }}
          path: ${{ steps.name.outputs.asset }}

  publish:
    name: 发布 ${{ needs.prep.outputs.tag }}
    needs: [prep, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prep.outputs.tag }}
          VER: ${{ needs.prep.outputs.version }}
        run: |
          ls -la artifacts
          gh release create "$TAG" --title "Suwayomi Tray $VER" \
            --notes "桌面壳 $VER（六个桌面 target 的裸可执行文件）。Suwayomi-next 打包时按 target 取用。" \
            artifacts/*
