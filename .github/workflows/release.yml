name: Release

# 桌面壳（Tauri 托盘）的独立发布流水线。产出桌面 target 的裸可执行文件，由
# Suwayomi-next 的打包流程按 <base>/suwayomi-tray-<V>-<target>[.exe] 下载并放进发布包
# 根目录（与 bin/suwayomi-server 同级）。
#
# 触发（与主仓同款，不再由 tag 驱动）：
#   推送 main        → 自动构建 alpha（windows-x64 + linux-x64，两个主要桌面 target，工具链 msvc）
#   workflow_dispatch → alpha / beta / release（通道 + target 复选 + Windows 工具链三选）
# 编译与打包全部委托给可复用工作流 .github/workflows/build.yml，质量门禁委托给
# lint.yml —— 两者都必须在 build 之前过；本文件只算版本号、挑 target、把构建产物
# 发布成 Release。
#
# 版本号套主仓规则，只换基线与主版本（本仓库自己的计数，不跟主仓）：
#   versionCode = 本仓库提交数 + 1000     （主仓是 +3000）
#   版本名      = 1.{count/100}.{count%100:02d}（主仓是 3.y.z；主版本 1 是本仓自己的）
#   tag     release → v{版本名} / beta → v{版本名}-beta.{run_id} / alpha → {版本名}-alpha.{run_id}
# 版本名必须始终是三段 semver：build-tray.sh 会把它注入 tauri.conf.json，Windows 上还进
# PE 版本资源 —— 写成 r{code} 会在编译那步被 tauri-build 拒掉。

on:
  push:
    branches: [main]
    # 纯文档改动不出包：一次桌面构建要占多个 runner 分钟，而文档改动对产物没有任何
    # 影响。只要改动里还有一个非 .md 文件就照跑 —— paths-ignore 只在"全部改动都命中"
    # 时才跳过。本文件自身不在忽略范围，所以改 CI 一定会触发。
    # `*.md` 与 `**/*.md` 两条都给：`**/` 能否匹配"零级目录"（即命中根目录的
    # README.md）在 glob 实现之间有歧义（GitHub 官方 cheat sheet 给的是 `'**.js'`），
    # 两条并置后无论哪种语义都覆盖到根目录与嵌套。
    paths-ignore:
      - '*.md'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      channel:
        description: 发布通道
        type: choice
        options: [alpha, beta, release]
        default: alpha
      # Windows 工具链：口径与主仓 Suwayomi-next 一致 —— msvc 走 VS 生成工具，gnullvm 走
      # llvm-mingw（自带 CRT，不需要 MSVC 运行时）；all 是两套都出。gnullvm 那份的资产名多
      # 一段 -gnullvm，主仓按自己那份 server 的工具链取对应的桌面壳。
      windows_toolchain:
        description: Windows 工具链
        type: choice
        options: [msvc, gnullvm, all]
        default: msvc
      build_windows_x64:
        description: Windows x64
        type: boolean
        default: true
      build_windows_arm64:
        description: Windows arm64
        type: boolean
        default: true
      build_linux_x64:
        description: Linux x64
        type: boolean
        default: true
      build_linux_arm64:
        description: Linux arm64
        type: boolean
        default: true
      build_macos_x64:
        description: macOS x64
        type: boolean
        default: true
      build_macos_arm64:
        description: macOS arm64
        type: boolean
        default: true
      version_count:
        description: 版本计数（留空用仓库提交数）
        type: string
        default: ''
      release_notes:
        description: 发行说明
        type: string
        default: ''

concurrency:
  # 同一 ref 上的发布排队而不是并行：主仓的 refresh_companions 会派发这里，两次派发撞上时
  # 并行跑同一批 target 会白烧 runner 分钟（macOS 还是 10x 计费），并让"哪条 run 对应哪个
  # release"变得难认。ext-runtime 的 release.yml 是同一条规则。
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prep:
    name: 准备构建参数
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      flow: ${{ steps.out.outputs.flow }}
      channel: ${{ steps.out.outputs.channel }}
      version_name: ${{ steps.out.outputs.version_name }}
      version_code: ${{ steps.out.outputs.version_code }}
      count: ${{ steps.out.outputs.count }}
      tag: ${{ steps.out.outputs.tag }}
      prerelease: ${{ steps.out.outputs.prerelease }}
      targets: ${{ steps.out.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: out
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FLOW="manual"
            CHANNEL="${{ github.event.inputs.channel }}"
            COUNT="${{ github.event.inputs.version_count }}"
            WIN_TC="${{ github.event.inputs.windows_toolchain }}"
            # input 缺失时渲染成空串（不是 "false"），兜成默认值。
            WIN_TC="${WIN_TC:-msvc}"
            # 手动触发默认全量六个 target（缺一个 target 会让主仓打包时静默丢桌面壳）
            SEL=""
            [ "${{ github.event.inputs.build_windows_x64 }}" = "true" ] && SEL="$SEL windows-x64"
            [ "${{ github.event.inputs.build_windows_arm64 }}" = "true" ] && SEL="$SEL windows-arm64"
            [ "${{ github.event.inputs.build_linux_x64 }}" = "true" ] && SEL="$SEL linux-x64"
            [ "${{ github.event.inputs.build_linux_arm64 }}" = "true" ] && SEL="$SEL linux-arm64"
            [ "${{ github.event.inputs.build_macos_x64 }}" = "true" ] && SEL="$SEL macos-x64"
            [ "${{ github.event.inputs.build_macos_arm64 }}" = "true" ] && SEL="$SEL macos-arm64"
          else
            # 推送 main：自动 alpha。托盘代码改动频率远低于主仓，六个 target 全跑要把
            # macOS runner（10x 计费）也算进去，所以自动构建只覆盖两个主要桌面 target。
            FLOW="auto"
            CHANNEL="alpha"
            COUNT=""
            WIN_TC="msvc"
            SEL="windows-x64 linux-x64"
          fi

          if [ -z "$COUNT" ]; then COUNT="$(git rev-list --count HEAD)"; fi

          VER_CODE="$((COUNT+1000))"
          # 三个通道共用同一个版本名（见文件头注释），通道差异落在 tag 与 prerelease 上
          VER_NAME="1.$((COUNT/100)).$(printf '%02d' $((COUNT%100)))"

          case "$CHANNEL" in
            release) TAG="v${VER_NAME}";                          PRE="false" ;;
            beta)    TAG="v${VER_NAME}-beta.${{ github.run_id }}"; PRE="false" ;;
            alpha)   TAG="${VER_NAME}-alpha.${{ github.run_id }}"; PRE="true" ;;
            *)       echo "::error::未知通道 $CHANNEL"; exit 1 ;;
          esac

          if [ -z "$SEL" ]; then
            echo "::error::未选择任何构建目标"
            exit 1
          fi
          # 工具链只有这三支。拼错的取值会凭空造出一个不存在的 rust target，那时每个 target
          # 都要白跑一遍编译才报错 —— 在这里拦下来。
          case "$WIN_TC" in
            msvc|gnullvm|all) ;;
            *) echo "::error::未知的 Windows 工具链：$WIN_TC"; exit 1 ;;
          esac

          # runner 与 rust target 与主仓 Suwayomi-next 的桌面矩阵一致（原生同架构编译）。
          # （macos-13 已被 GitHub 下线，x64 macOS 现为 macos-15-intel。）
          # Windows 两行按 windows_toolchain 展开：msvc 用 target 原名，gnullvm 在 target 名后
          # 加 -gnullvm —— 资产名从 target 派生，主仓也按同一名字取，这一维只加在这里。
          INCLUDE="$(python3 - "$SEL" "$WIN_TC" <<'PY'
          import json, sys

          tc = sys.argv[2]
          WIN = {
              "windows-x64":   ("windows-latest", "x86_64-pc-windows-"),
              "windows-arm64": ("windows-11-arm", "aarch64-pc-windows-"),
          }
          mapping = {
              "linux-x64":   ("ubuntu-latest",    "x86_64-unknown-linux-gnu"),
              "linux-arm64": ("ubuntu-24.04-arm", "aarch64-unknown-linux-gnu"),
              "macos-x64":   ("macos-15-intel",   "x86_64-apple-darwin"),
              "macos-arm64": ("macos-15",         "aarch64-apple-darwin"),
          }
          # all 是两套都出；顺序与「单独跑两次」一致（msvc 在前）。
          tcs = ("msvc", "gnullvm") if tc == "all" else (tc,)
          inc = []
          for t in sys.argv[1].split():
              if t in WIN:
                  os_name, triple = WIN[t]
                  for one in tcs:
                      inc.append({"target": t if one == "msvc" else f"{t}-{one}",
                                  "os": os_name, "rust_target": f"{triple}{one}"})
              elif t in mapping:
                  os_name, rt = mapping[t]
                  inc.append({"target": t, "os": os_name, "rust_target": rt})
          print(json.dumps(inc))
          PY
          )"

          {
            echo "flow=$FLOW"
            echo "channel=$CHANNEL"
            echo "version_name=$VER_NAME"
            echo "version_code=$VER_CODE"
            echo "count=$COUNT"
            echo "tag=$TAG"
            echo "prerelease=$PRE"
            echo "targets=$INCLUDE"
          } >> "$GITHUB_OUTPUT"
          echo "$FLOW 发布: $CHANNEL $VER_NAME (code $VER_CODE, commits $COUNT) -> $TAG"
          echo "   targets=[$SEL] win_tc=$WIN_TC"

  lint:
    name: 质量门禁（复用 lint.yml）
    # 与 prep 并行，不占发布链路的时间；门禁不过时由 build 的 needs 拦住编译。
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  build:
    name: 构建（复用 build.yml）
    needs: [prep, lint]
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      version_name: ${{ needs.prep.outputs.version_name }}
      version_code: ${{ needs.prep.outputs.version_code }}
      channel: ${{ needs.prep.outputs.channel }}
      targets: ${{ needs.prep.outputs.targets }}

  publish:
    name: 发布 ${{ needs.prep.outputs.channel }} (${{ needs.prep.outputs.version_name }})
    needs: [prep, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release create 要跑在 git 仓库里（它用 Git 推断仓库与最近提交），
      # 这一步漏了的表现是 `failed to run git: fatal: not a git repository`。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: 收到的构建产物
        run: ls -laR artifacts
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          FLOW: ${{ needs.prep.outputs.flow }}
          TAG: ${{ needs.prep.outputs.tag }}
          VER: ${{ needs.prep.outputs.version_name }}
          CH: ${{ needs.prep.outputs.channel }}
          PRE: ${{ needs.prep.outputs.prerelease }}
          NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          # release 通道同版本重复发布：先删旧 tag/release（alpha/beta 的 tag 天然唯一，不删）
          if [ "$CH" = "release" ] && gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi

          FILES=()
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            FILES+=("$f")
          done

          if [ "$FLOW" = "auto" ]; then
            gh release create "$TAG" "${FILES[@]}" \
              --title "Suwayomi Tray $VER (alpha)" \
              --notes "桌面壳 $VER · alpha（自动构建，仅 windows-x64 + linux-x64，工具链 msvc）。" \
              --prerelease \
              --generate-notes
            exit 0
          fi

          BODY="桌面壳 $VER（每个桌面 target 一份裸可执行文件）。Windows 的 gnullvm 那份另带一份同名（换扩展名）的 WebView2Loader.dll，两个文件要放在一起。Suwayomi-next 打包时按 target 与自己那份 server 的工具链取用。"
          NOTES="${NOTES//$'\r'/}"
          if [ -n "$NOTES" ]; then
            BODY="$BODY

          $(printf '%b' "$NOTES")"
          fi

          gh release create "$TAG" "${FILES[@]}" \
            --title "Suwayomi Tray $VER ($CH)" \
            --notes "## Suwayomi Tray $VER · $CH
          $BODY" \
            --prerelease="$PRE" \
            --generate-notes
