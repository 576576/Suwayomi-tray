<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <title>Suwayomi 托盘设置</title>
    <style>
      /* 亮色默认（跟随系统 prefers-color-scheme，JS 再兜底） */
      :root {
        --bg: #f5f6f8; --fg: #1f2328; --muted: #57606a;
        --border: #d0d7de; --btn-bg: #fff; --accent: #1f883d; --accent-fg: #fff;
      }
      html[data-dark="true"] {
        --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e;
        --border: #30363d; --btn-bg: #21262d; --accent: #238636; --accent-fg: #fff;
      }
      body { font-family: system-ui, "Microsoft YaHei", sans-serif; margin: 0; padding: 16px 20px; background: var(--bg); color: var(--fg); }
      h3 { margin: 0 0 14px; font-size: 15px; }
      label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
      input[type="text"], input[type="number"] {
        width: 100%; box-sizing: border-box; padding: 6px 8px;
        border: 1px solid var(--border); border-radius: 6px; font-size: 13px;
        background: var(--btn-bg); color: var(--fg);
      }
      .row { margin-top: 14px; display: flex; gap: 8px; align-items: center; }
      button {
        padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
        background: var(--btn-bg); color: var(--fg); font-size: 13px; cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
      .switch { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--fg); cursor: pointer; }
      .switch input { width: auto; }
      #current { margin-top: 8px; font-size: 12px; color: var(--muted); word-break: break-all; }
      #url { margin-top: 8px; font-size: 12px; color: var(--muted); word-break: break-all; }
      #msg { margin-top: 8px; font-size: 12px; color: var(--accent); min-height: 16px; }
      .hint { font-size: 11px; color: var(--muted); margin-top: 3px; }
    </style>
  </head>
  <body>
    <h3>Suwayomi 托盘设置</h3>

    <label for="port">服务器端口</label>
    <input id="port" type="number" min="1" max="65535" placeholder="自动" />
    <div class="hint" id="port-hint"></div>

    <label for="server-address">服务器地址</label>
    <input id="server-address" type="text" placeholder="留空 = 本机" />
    <div class="hint">留空 = 本机回环 + 上面的端口；也可填局域网/远程地址（如 192.168.1.10 或 http://nas:4567）。</div>

    <label for="data-dir">工作数据目录</label>
    <input id="data-dir" type="text" placeholder="默认" />
    <div class="hint" id="current"></div>

    <label class="switch">
      <input id="open-webui-on-startup" type="checkbox" /> 启动时自动打开 WebUI
    </label>

    <label class="switch">
      <input id="prefer-web-view" type="checkbox" /> 用窗口打开 WebUI（系统 WebView）
    </label>
    <div class="hint">关闭后改用系统浏览器打开；无系统 WebView 的环境会自动回退浏览器。</div>

    <div class="row">
      <button id="save" class="primary">保存</button>
      <button id="restart">重启服务端</button>
      <button id="open-data">打开数据目录</button>
    </div>
    <div id="url"></div>
    <div id="msg"></div>

    <script>
      const { invoke } = window.__TAURI__.core;

      // 暗黑模式：优先跟随系统 prefers-color-scheme；查不到（不支持）则默认暗黑
      function applyTheme() {
        let dark = true;
        if (window.matchMedia) {
          const mq = window.matchMedia("(prefers-color-scheme: dark)");
          if (mq && mq.matches !== undefined) dark = mq.matches;
        }
        document.documentElement.setAttribute("data-dark", dark ? "true" : "false");
      }
      applyTheme();
      if (window.matchMedia) {
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
      }

      window.addEventListener("DOMContentLoaded", async () => {
        try {
          const s = await invoke("get_settings");
          // 空 = 自动：留空就是「让托盘挑一个能绑的端口」，不写死具体数字
          document.getElementById("port").value = s.serverPort ?? "";
          document.getElementById("port-hint").textContent =
            "当前实际端口: " + s.effectivePort + "。留空 = 自动（默认 4567，被占用或被系统保留则顺延）";
          document.getElementById("server-address").value = s.serverAddress || "";
          document.getElementById("data-dir").value = s.dataDirOverride || "";
          document.getElementById("current").textContent = "当前目录: " + s.dataDir;
          document.getElementById("open-webui-on-startup").checked = s.openWebUiOnStartup;
          document.getElementById("prefer-web-view").checked = s.preferWebView;
          document.getElementById("url").textContent = "WebUI: " + s.webUiUrl;
        } catch (e) {
          document.getElementById("msg").textContent = "读取设置失败: " + e;
        }
      });

      document.getElementById("save").onclick = async () => {
        const raw = document.getElementById("port").value.trim();
        // 留空 → null（自动档）
        const p = raw === "" ? null : parseInt(raw, 10);
        if (raw !== "" && (!Number.isInteger(p) || p < 1 || p > 65535)) {
          document.getElementById("msg").textContent = "端口无效（1-65535，或留空自动）";
          return;
        }
        const dd = document.getElementById("data-dir").value.trim();
        const sa = document.getElementById("server-address").value.trim();
        const ow = document.getElementById("open-webui-on-startup").checked;
        const pe = document.getElementById("prefer-web-view").checked;
        try {
          await invoke("save_settings", { serverPort: p, serverAddress: sa || null, dataDir: dd, openWebUiOnStartup: ow, preferWebView: pe });
          document.getElementById("current").textContent = "当前目录: " + (dd || "默认");
          document.getElementById("msg").textContent = "已保存，点击「重启服务端」生效";
        } catch (e) {
          document.getElementById("msg").textContent = "保存失败: " + e;
        }
      };
      document.getElementById("restart").onclick = async () => {
        try {
          const url = await invoke("restart_server_cmd");
          document.getElementById("url").textContent = "WebUI: " + url;
          document.getElementById("msg").textContent = "服务端已重启";
          const s = await invoke("get_settings");
          document.getElementById("port").value = s.serverPort ?? "";
          document.getElementById("server-address").value = s.serverAddress || "";
          document.getElementById("port-hint").textContent =
            "当前实际端口: " + s.effectivePort + "。留空 = 自动（默认 4567，被占用或被系统保留则顺延）";
        } catch (e) {
          document.getElementById("msg").textContent = "重启失败: " + e;
        }
      };
      document.getElementById("open-data").onclick = () => invoke("open_data_dir");
    </script>
  </body>
</html>
